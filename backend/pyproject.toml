[project]
name = "pawspot-backend"
version = "0.1.0"
description = "PawSpot API bootstrap"
requires-python = ">=3.14,<3.15"
dependencies = [
  "fastapi>=0.142.2,<0.143",
  "uvicorn>=0.54,<0.55",
  "pydantic-settings>=2.15,<2.16",
  "sqlalchemy>=2.1.3,<2.2",
  "psycopg[binary]>=3.3.6,<3.4",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<0.29",
  "pytest>=9.1.1,<9.2",
  "ruff>=0.16.10,<0.17",
  "mypy>=2.4,<2.5",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pawspot"]
