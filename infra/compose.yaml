services:
  postgres:
    image: postgis/postgis:18-3.6
    platform: linux/amd64
    environment:
      POSTGRES_DB: ${PAWSPOT_DB_NAME:-pawspot}
      POSTGRES_USER: ${PAWSPOT_DB_USER:-pawspot}
      POSTGRES_PASSWORD: ${PAWSPOT_DB_PASSWORD:?Set PAWSPOT_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${PAWSPOT_DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
