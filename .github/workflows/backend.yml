name: Backend checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:18-3.6
        env:
          POSTGRES_DB: pawspot_test
          POSTGRES_USER: pawspot
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pawspot -d pawspot_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      PAWSPOT_DB_HOST: 127.0.0.1
      PAWSPOT_DB_PORT: 5432
      PAWSPOT_DB_NAME: pawspot_test
      PAWSPOT_DB_USER: pawspot
      PAWSPOT_DB_PASSWORD: ""
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.23"
          python-version: "3.14"
      - run: uv sync --locked --all-packages --all-extras
      - run: uv run --locked --all-packages --all-extras pytest
      - run: uv run --locked --all-packages --all-extras ruff check backend bot
      - run: uv run --locked --all-packages --all-extras ruff format --check backend bot
      - run: uv run --locked --all-packages --all-extras mypy
      - run: uv run --locked --all-packages --all-extras alembic -c backend/alembic.ini upgrade head
      - run: uv run --locked --all-packages --all-extras alembic -c backend/alembic.ini downgrade base
      - run: uv run --locked --all-packages --all-extras alembic -c backend/alembic.ini upgrade head
      - run: uv run --locked --all-packages --all-extras pytest -m integration
      - run: uv run --locked --all-packages --all-extras python -c "from pawspot.db import get_postgis_version, get_engine; print(get_postgis_version(get_engine()))"
